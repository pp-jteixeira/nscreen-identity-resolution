version: 2
models:
- name: pii_clean
  description: Complete computed metrics from the downstream cookie intermediate. All 154 columns contain actual
    metric outputs, without placeholder columns or deferred updates.
  columns:
  - name: source
    data_tests:
    - not_null
  - name: email
    data_tests:
    - not_null
  - name: npi
    data_tests:
    - not_null
  - name: first_seen_day
    description: Earliest valid source day for this exact raw record; unknown without dated observations.
  - name: last_seen_day
    description: Latest valid source day for this exact raw record; not proof of continuous ownership.
  - name: observed_day_count
    description: Distinct valid observation dates for this exact record; null without valid dates.
  - name: observation_count
    description: Raw source-row observations represented by this exact record, including repeated snapshots.
    data_tests:
    - not_null
  - name: undated_observation_count
    description: Represented raw observations without a valid source day.
    data_tests:
    - not_null
  - name: invalid_day_observation_count
    description: Represented observations carrying a nonnull source day that could not be parsed.
    data_tests:
    - not_null
  - name: source_tables
    description: Raw source table identities retained with this record.
    data_tests:
    - not_null
  - name: source_feeds
    description: Retained vendor feed labels; may be an empty array.
    data_tests:
    - not_null
  - name: computed_at
    description: Query/materialization timestamp; excluded from substantive evidence checksums.
    data_tests:
    - not_null
  - name: definition_version
    description: Exact-record definition identifier.
    data_tests:
    - not_null
  - name: email_format_valid
    data_tests:
    - not_null
  - name: email_role_account
    description: Exact mailbox-name list match; not proof of shared ownership.
    data_tests:
    - not_null
  - name: email_domain_class
    description: Ordered domain-text heuristic; institutional, free, custom or unknown. Not verified affiliation.
    data_tests:
    - not_null
    - accepted_values:
        values:
        - institutional
        - free
        - custom
        - unknown
  - name: email_matches_source_name
    description: Nullable fuzzy email-to-name comparison within the exact source record; HealthLink uses HCP-reference
      names.
  - name: email_matches_registry_name
    description: Nullable fuzzy email-to-registry-name comparison; any usable registry name may match.
  - name: vendor_name_matches_registry_name
    description: Nullable fuzzy first-and-last comparison between vendor and registry name pairs.
  - name: source_name_usable
    data_tests:
    - not_null
  - name: registry_name_usable
    data_tests:
    - not_null
  - name: registry_npi_present
    data_tests:
    - not_null
  - name: record_id
    description: SHA256 of source table and raw payload excluding day.
    data_tests:
    - not_null
  - name: metric_row_id
    description: Unique record and email-position identifier.
    data_tests:
    - not_null
    - unique
  - name: email_ordinal
    description: Original position among candidate email fields.
    data_tests:
    - not_null
  - name: email_origin
    description: Source column or array/token position.
  - name: record_payload
    description: Raw identity fields, serialized as JSON; excludes only day.
  - name: email_npi_count
    description: Distinct nonempty reported NPIs for this source and cleaned email across retained history; includes
      malformed NPIs.
    data_tests:
    - not_null
  - name: email_has_multiple_npis
    description: True when this source reports more than one NPI for this email. No cross-vendor pooling.
    data_tests:
    - not_null
  - name: has_been_reassigned
    description: Reported NPI set changes between actual observed days for this vendor and email; may coexist with
      conflict. Null when undated observations prevent classification.
  - name: has_conflict_linkage
    description: Multiple reported NPIs on a day observed for this exact record. Endato, RocketReach and DRDB instead
      compare their complete current undated vendor data. Missing days in dated vendors can yield null.
  - name: observed_days
    description: Sorted distinct valid source delivery days for this exact record; empty when undated. Never an
      inferred date range.
    data_tests:
    - not_null
  - name: conflict_days
    description: Actual days of this record with multiple reported NPIs for its vendor and email; empty for undated
      vendors even when conflict is true.
    data_tests:
    - not_null
  - name: source_name_values
    description: Distinct usable normalized vendor first/last names and first-name variants for this metric row.
      HealthLink uses its HCP reference; registry names never fill missing vendor names.
    data_tests:
    - not_null
  - name: source_state_values
    description: Sorted distinct recognized US state/DC/territory codes for this record; HealthLink uses its HCP
      reference by NPI without date alignment. Missing, unrecognized and explicitly foreign values give an empty
      array.
    data_tests:
    - not_null
  - name: email_name_count
    description: Distinct normalized usable first/last-name pairs within this vendor and email across retained history.
      Zero means no usable names; fuzzy aliases remain separate spellings.
    data_tests:
    - not_null
  - name: email_npi_has_name_conflict
    description: True when any two usable names for this vendor/email/NPI disagree under metric 07 fuzzy rules;
      false with one name or all names compatible; null with no usable names.
  - name: conflicting_npis_share_name
    description: Record-local fuzzy name agreement with another NPI on overlapping conflict days, or in the undated
      vendor snapshot. True if any peer matches; false only if all comparisons are known mismatches; null for missing
      names or no established conflict.
  - name: conflicting_npi_name_comparisons
    description: Ordered peer comparison contexts with NPI, overlapping conflict days, usable vendor names and nullable
      shares_name. Empty without an established conflict; undated snapshot comparisons have empty days.
    data_tests:
    - not_null
  - name: conflicting_npis_share_state
    description: Record-local state overlap with other NPIs on overlapping conflict days or within the undated vendor
      snapshot. Any true wins; false requires all known mismatches; otherwise null, including no established conflict.
  - name: conflicting_npi_state_comparisons
    description: Ordered peer contexts with NPI, overlapping dates, normalized states and nullable shares_state,
      preserving manual-check details.
    data_tests:
    - not_null
  - name: facility_npi_values
    description: Sorted distinct ten-digit nonzero facility NPIs across all retained association ranks for this
      provider NPI. Missing or unusable reference IDs give an empty array; no historical date alignment.
    data_tests:
    - not_null
  - name: facility_reference_table
    description: Reference relation used for the association lookup.
    data_tests:
    - not_null
  - name: facility_definition_version
    description: 'all_ranked_facility_npis_v1: exact facility-NPI overlap, not provider-scoped cluster IDs.'
    data_tests:
    - not_null
  - name: conflicting_npis_share_facility
    description: Any overlapping conflict peer shares a retained facility NPI. False only when all peer comparisons
      have usable disjoint facility sets; otherwise null, including missing evidence or no established conflict.
      Associations have no activity dates and do not establish coattendance.
  - name: conflicting_npi_facility_comparisons
    description: Ordered peer NPI/date contexts with retained facility NPIs, their exact intersection and nullable
      shares_facility.
    data_tests:
    - not_null
  - name: specialty_code_values
    description: Sorted distinct recognized NPPES taxonomy codes across all fifteen slots, joined by NPI without
      historical date alignment. Missing or unrecognized-only sets give an empty array.
    data_tests:
    - not_null
  - name: specialty_reference_table
    description: NPPES provider relation used for specialty-code evidence. Codes must also occur in iceberg.npi.npi_taxonomy.
    data_tests:
    - not_null
  - name: specialty_definition_version
    description: 'recognized_exact_taxonomy_all_slots_v1: exact code overlap across all fifteen primary/secondary
      slots; no broad-class or label fallback.'
    data_tests:
    - not_null
  - name: conflicting_npis_share_nppes_specialty
    description: Any conflict peer shares an exact recognized taxonomy code. False requires known disjoint retained
      sets for all peers; otherwise null, including no established conflict. Current reference does not establish
      historical or same-day specialty.
  - name: conflicting_npi_specialty_comparisons
    description: Ordered peer contexts with NPI, exact overlapping conflict dates, recognized taxonomy codes, shared
      codes and nullable shares_specialty.
    data_tests:
    - not_null
  - name: npi_registry_status
    description: 'Current readable NPPES lifecycle classification: active_as_reported, deactivated, reactivated,
      replaced, not_found or unknown. Not historical status on vendor delivery dates.'
    data_tests:
    - not_null
    - accepted_values:
        values:
        - active_as_reported
        - deactivated
        - reactivated
        - replaced
        - not_found
        - unknown
  - name: npi_registry_status_reason
    description: Explicit classification or uncertainty reason, including malformed/future dates, contradictory
      records, self-replacement and ambiguous event ordering.
    data_tests:
    - not_null
  - name: npi_registry_replacement_npi
    description: Single agreed ten-digit nonzero nonself replacement NPI, if reported. Its registry presence and
      checksum are not validated; links are never automatically redirected.
  - name: npi_registry_deactivation_date
    description: Parsed agreed deactivation date. Null if absent, invalid or reference variants conflict.
  - name: npi_registry_reactivation_date
    description: Parsed agreed reactivation date. Null if absent, invalid or reference variants conflict.
  - name: npi_registry_reference_row_count
    description: Number of readable NPPES records for this NPI, including duplicates; zero when unmatched.
    data_tests:
    - not_null
  - name: npi_registry_variant_count
    description: Distinct trimmed lifecycle tuples. More than one yields unknown rather than choosing an arbitrary
      record.
    data_tests:
    - not_null
  - name: npi_registry_lifecycle_evidence
    description: Distinct original deactivation/reactivation strings, replacement NPI strings and reason codes.
      Empty without a reference match.
    data_tests:
    - not_null
  - name: npi_registry_status_as_of_day
    description: Date used to reject future events; Europe/Paris current date unless explicitly fixed. Does not
      reconstruct historical registry versions.
    data_tests:
    - not_null
  - name: npi_registry_reference_table
    description: iceberg.npi.nppes_npidata_latest; separate from the registry-name lookup.
    data_tests:
    - not_null
  - name: npi_registry_definition_version
    description: 'nppes_lifecycle_consensus_v1: normalized tuple agreement, date chronology and retained replacement
      evidence.'
    data_tests:
    - not_null
  - name: facility_primary_state
    description: Single recognized rank-1 facility state when every retained rank-1 row has a recognized state and
      nonblank location; null for ambiguity or missing evidence.
  - name: facility_reference_status
    description: usable, ambiguous_state, missing_state, missing_location or no_rank1_association; independent of
      vendor-state availability.
    data_tests:
    - not_null
  - name: facility_rank1_rows
    description: Raw rank-1 reference rows before per-NPI collapse; zero without a match.
    data_tests:
    - not_null
  - name: facility_rank1_state_count
    description: Distinct recognized rank-1 facility states before collapse.
    data_tests:
    - not_null
  - name: facility_rank1_unknown_state_rows
    description: Rank-1 reference rows with missing or unrecognized state.
    data_tests:
    - not_null
  - name: facility_rank1_missing_location_rows
    description: Rank-1 reference rows with blank or missing coordinates.
    data_tests:
    - not_null
  - name: vendor_state_evidence
    description: 'Record-state versus own-NPI facility reference: corroborated, not_corroborated, mixed_vendor_states,
      unknown_vendor_state or unknown_facility.'
    data_tests:
    - not_null
  - name: vendor_state_corroborated
    description: True only for a single matching vendor state, false for known disjoint states, null for mixed or
      unknown evidence.
  - name: location_evaluation_day
    description: Europe/Paris evaluation day, or explicit location_evidence_day. No historical vendor-day reconstruction.
    data_tests:
    - not_null
  - name: location_reference_table
    description: bq_bi.analytics_prod.npi_facility_locations_with_ids; only rank-1 rows are used.
    data_tests:
    - not_null
  - name: location_evidence_version
    description: record_vendor_facility_state_v1; record-grain descriptive comparison without scoring.
    data_tests:
    - not_null
  - name: cookie_count
    description: Distinct usable mapped UID strings within the stored completed-day window; not verified browser-cookie
      counts.
    data_type: bigint
  - name: cookie_mapping_days
    description: Distinct dates with a valid email-hash/UID mapping.
    data_type: bigint
  - name: cookie_mapped_uid_days
    description: Distinct UID/mapping-day tuples after token and row deduplication.
    data_type: bigint
  - name: cookie_observed_uid_days
    description: Mapped UID-days with any same-day geo observation, including unmapped ZIP3 states.
    data_type: bigint
  - name: cookie_located_uid_days
    description: Mapped UID-days whose ranked primary recognized state appears on that day; includes tied winners.
    data_type: bigint
  - name: cookie_eligible_uid_days
    description: Located mapped UID-days with an untied primary state; only these establish state comparisons.
    data_type: bigint
  - name: cookie_located_count
    description: Distinct UIDs with a located primary-state mapping day, including ties.
    data_type: bigint
  - name: cookie_primary_state_tied_count
    description: Distinct mapped UIDs with multiple recognized states tied for most observed dates.
    data_type: bigint
  - name: cookie_primary_state_multistate_count
    description: Distinct mapped UIDs with more than one recognized state in the window.
    data_type: bigint
  - name: cookie_eligible_observed_days
    description: Distinct mapping dates carrying untied primary-state observations.
    data_type: bigint
  - name: cookie_location_first_day
    description: First untied primary-state mapping date; null without usable observations.
    data_type: date
  - name: cookie_location_last_day
    description: Last untied primary-state mapping date; null without usable observations.
    data_type: date
  - name: cookie_uid_types
    description: Sorted distinct mapping namespace labels; raw UID strings retain their prefixes for joins.
    data_type: array(varchar)
  - name: cookie_state_values
    description: Sorted distinct untied primary states observed on matching mapping dates. Tied states supply no
      agreement.
    data_type: array(varchar)
  - name: cookie_location_window_days
    description: Completed calendar days before evaluation, three by default.
    data_type: bigint
  - name: cookie_mapping_available_days
    description: Dates present in mapping partition metadata; presence does not prove complete rows.
    data_type: bigint
  - name: cookie_location_available_days
    description: Dates present in geo partition metadata; presence does not prove complete rows.
    data_type: bigint
  - name: cookie_mapping_missing_days
    description: Expected dates absent from mapping metadata; missing dates are not mismatches.
    data_type: array(date)
  - name: cookie_location_missing_days
    description: Expected dates absent from geo metadata.
    data_type: array(date)
  - name: cookie_location_window_status
    description: all_source_days_present or missing_source_days; not a population-completeness guarantee.
    data_type: varchar
  - name: cookie_state_count
    description: Number of retained usable cookie_state_values.
    data_type: bigint
  - name: cookie_location_status
    description: no_mapping, observed, ambiguous_primary_state, unknown_state or no_state_observation. no_mapping
      means no valid parsed mapping, not proof that no cookie exists.
    data_tests:
    - not_null
    data_type: varchar
  - name: cookie_vendor_state_evidence
    description: "Untied observed primary states versus this exact record\u2019s source_state_values; nullable evidence\
      \ is represented by explicit unknown labels."
    data_type: varchar
  - name: cookie_facility_state_evidence
    description: "Untied observed primary states versus this NPI\u2019s usable rank-1 facility state."
    data_type: varchar
  - name: cookie_location_window_start
    description: Evaluation day minus seven; current and future days are excluded.
    data_type: date
  - name: cookie_location_window_end
    description: Evaluation day minus one, inclusive.
    data_type: date
  - name: cookie_mapping_table
    description: iceberg.thirdparty.liveintent_idsync.
    data_type: varchar
  - name: cookie_location_geo_table
    description: iceberg.crossscreen.nscreen_geo_daily_ua; snapshots may share a 15-day hourly lookback.
    data_type: varchar
  - name: cookie_zip_mapping_table
    description: iceberg.jteixeira_ipa.tmp_zip3_to_state; provider-derived mapping, not authoritative postal boundaries.
    data_type: varchar
  - name: cookie_location_evidence_version
    description: liveintent_primary_state_untied_v1; no scores or fractional votes.
    data_type: varchar
  - name: link_freshness_as_of_day
    description: Evaluation day for stored link freshness, Europe/Paris today unless overridden.
    data_tests:
    - not_null
  - name: source_latest_observed_day
    description: Latest valid parsed observation day among retained eligible records for this vendor, including
      future dates.
  - name: link_last_observed_day
    description: Latest observation day across this source/email/NPI link, propagated to every retained record.
      Null when undated.
  - name: source_age_days
    description: Days from source_latest_observed_day to evaluation day. Null for undated or future-dated source
      evidence.
  - name: link_lag_days
    description: Days from link_last_observed_day to source_latest_observed_day. Null for undated links or future-dated
      source evidence. No stale threshold.
  - name: email_observed_day_count
    description: Distinct known observation days across all NPIs for this source/email. Zero means no dated email
      history.
    data_tests:
    - not_null
  - name: link_observed_day_count
    description: Distinct known observation days for this source/email/NPI, across all records and email positions.
    data_tests:
    - not_null
  - name: link_conflict_day_count
    description: Distinct days this source/email/NPI overlapped another NPI. Zero counts known overlap days only.
    data_tests:
    - not_null
  - name: link_presence_share
    description: Link observed days divided by email observed days, as a fraction from zero to one. Null when this
      link has no dated observations.
  - name: link_overlap_share
    description: Link conflict days divided by link observed days, as a fraction from zero to one. Null for undated
      links.
  - name: link_stability_has_undated_observations
    description: True when any record for this source/email, including peer NPIs, contains undated or invalid-day
      observations. Shares cover known dates only.
    data_tests:
    - not_null
  - name: npi_format_valid
    description: Ten ASCII digits beginning with 1 through 4. Null for missing input.
  - name: npi_checksum_valid
    description: Luhn checksum including the 80840 prefix. Null unless input has exactly ten ASCII digits.
  - name: npi_structure_valid
    description: Format and checksum both pass. Does not establish registry existence or activity.
  - name: npi_structure_reason
    description: missing, malformed, unsupported_prefix, checksum_failure or valid, in that priority order.
    data_tests:
    - not_null
  - name: npi_entity_type
    description: 'Registry consensus: individual, organization or unknown. Independent of structure and lifecycle
      status.'
    data_tests:
    - not_null
  - name: npi_entity_type_reason
    description: registry_consensus, not_found, conflicting_reference_records, missing_entity_type or unrecognized_entity_type.
    data_tests:
    - not_null
  - name: npi_entity_type_evidence
    description: Distinct raw NPPES entity type codes, including null evidence. Empty array when no reference record
      exists.
    data_tests:
    - not_null
  - name: npi_entity_type_reference_row_count
    description: Number of NPPES reference rows for the identifier. Duplicate rows never multiply metric records.
    data_tests:
    - not_null
  - name: npi_entity_type_variant_count
    description: Number of distinct trimmed entity-code variants, counting missing as a variant.
    data_tests:
    - not_null
  - name: npi_identity_as_of_day
    description: Europe/Paris evaluation date for current registry evidence. Not the reference file delivery date
      or historical vendor-day evidence.
    data_tests:
    - not_null
  - name: npi_identity_reference_table
    description: Registry relation used for entity type evidence.
    data_tests:
    - not_null
  - name: npi_identity_definition_version
    description: Version of structural validation and entity-consensus rules.
    data_tests:
    - not_null
  - name: source_vendor_specialty_values
    description: Distinct normalized vendor specialty labels across the exact record observation days. Comparisons
      use day-specific evidence, not this union.
    data_tests:
    - not_null
  - name: source_vendor_profession_values
    description: Distinct normalized vendor profession labels across the exact record observation days. Credentials
      and registry classifications are excluded.
    data_tests:
    - not_null
  - name: vendor_professional_evidence
    description: Per-observation-day vendor table provenance, raw specialty/profession labels and normalized values.
      Metadata joins match the delivery day and NPI, plus Medscape guid. Empty arrays preserve missing evidence.
    data_tests:
    - not_null
  - name: vendor_professional_definition_version
    description: Version of vendor-label normalization, same-day joins and conflict comparison rules.
    data_tests:
    - not_null
  - name: conflicting_npis_share_vendor_specialty
    description: Whether any conflicting peer NPI has an exact normalized vendor specialty overlap on the same conflict
      day, or in the undated DRDB snapshot. False requires all comparisons known and disjoint. Otherwise unknown
      or inapplicable.
  - name: conflicting_npi_vendor_specialty_comparisons
    description: Peer NPI, metric row ID, evidence day, own and peer specialty labels, shared labels and nullable
      shares_specialty.
    data_tests:
    - not_null
  - name: conflicting_npis_share_vendor_profession
    description: Whether any conflicting peer NPI has an exact normalized vendor profession overlap on the same
      conflict day. False requires all comparisons known and disjoint. Missing profession evidence stays unknown.
  - name: conflicting_npi_vendor_profession_comparisons
    description: Peer NPI, metric row ID, evidence day, own and peer profession labels, shared labels and nullable
      shares_profession.
    data_tests:
    - not_null
  - name: sequence_as_of_day
    description: Inclusive evaluation cutoff for sequential history and registration supersession. Defaults to Europe/Paris
      today. Daily evidence uses only observations through its own day.
  - name: sequence_definition_version
    description: Sequence, delivery-version and cumulative-count rule version.
  - name: sequence_history_status
    description: dated_history, incomplete_dates or no_dated_history. Known-date counts do not infer missing observations.
  - name: sequence_has_undated_observations
    description: Any eligible record for this source/email has missing or invalid observation dates.
  - name: sequence_min_versions
    description: Minimum observed delivery versions required by stability_history_sufficient. Default three.
  - name: n_versions_observed
    description: Eligible delivery versions containing this source/email through evaluation. Consecutive equal HealthLink/QuantumMedica
      email/NPI content fingerprints collapse. Medscape and Haymarket use observed days.
  - name: n_npis_window
    description: Distinct NPIs observed for this source/email across all retained dated history through sequence_as_of_day.
      No rolling window is applied.
  - name: n_npi_changes
    description: Consecutive observed email-day transitions with any NPI addition or removal. Initial observation
      is not a change.
  - name: n_swaps
    description: Observed transitions with both added and removed NPIs. Count transitions rather than individual
      NPIs.
  - name: n_flipbacks
    description: Swap transitions that add at least one NPI observed previously for this source/email.
  - name: stability_history_sufficient
    description: Whether n_versions_observed reaches sequence_min_versions. False without dated history. Does not
      establish ownership or independent confirmation.
  - name: sequence_daily_evidence
    description: Ordered observed-day NPI sets, previous observed day, added/removed/returned NPIs and cumulative
      versions, NPIs, changes, swaps, flipbacks and sufficiency. Each entry uses only its day and earlier observations.
      Repeated source copies do not increment content versions.
  - name: registration_guid
    description: Cleaned Medscape registration GUID from the exact raw record. NULL for other sources.
  - name: registration_link_status
    description: 'Medscape source/GUID/email/NPI status through sequence_as_of_day: latest_observed, superseded,
      ambiguous_latest or unknown. Other sources are not_applicable. Missing GUID, dates or incomplete registration
      chronology remain unknown.'
  - name: registration_latest_observed_day
    description: Latest eligible dated observation for this source/GUID/email through sequence_as_of_day.
  - name: registration_latest_npis
    description: Distinct NPIs on registration_latest_observed_day. Multiple NPIs are ambiguous and never arbitrarily
      resolved.
  - name: registration_link_last_observed_day
    description: Last eligible dated observation of this source/GUID/email/NPI through sequence_as_of_day.
  - name: registration_superseded_since_day
    description: First observed registration day after the old NPI last appeared, only when its current status is
      superseded. This classification is evaluated at sequence_as_of_day and is not a historical ownership claim.
  - name: registration_superseded_by_npis
    description: Unique latest observed registration NPI for a superseded link. Empty for unknown, ambiguous, latest
      or inapplicable links.
  - name: registration_supersession_definition_version
    description: Registration supersession rule version. No links are removed or redirected.
